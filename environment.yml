name: crm-syncom
channels:
  - conda-forge
  - nodefaults
dependencies:
  # --- interpreter ---
  - python=3.10.*

  # --- numerics (pinned to minor: these affect results) ---
  - numpy=2.2.*
  - scipy=1.15.*
  - pandas=2.3.*
  - statsmodels=0.14.*
  - networkx=3.4.*

  # --- plotting (base variants: no Qt/X11) ---
  - matplotlib-base=3.10.*
  - seaborn-base=0.13.*
  - plotly=6.3.*

  # --- notebooks / dev ---
  - ipykernel
  - jupyterlab
  - tqdm

  # --- pip-only (not on conda-forge) ---
  - pip
  - pip:
      - textalloc==1.2.1